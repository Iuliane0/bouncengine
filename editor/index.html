                if (id >= 51 && id <= 54) return loadedTextures.TEX_JUMP_BOOST_DEVICE;
                if (id === 55) return loadedTextures.TEX_CRYSTAL;
                return null;
            }

            // Get rotation angle for a tile ID (in radians)
            function getTileRotation(id) {
                // Rotatable tiles: candle (3-6), pump (43-46), valve (39-42), gravity (47-50), jump (51-54)
                // Rotation index: 0=up, 1=right, 2=down, 3=left
                const rotationGroups = [
                    [3, 4, 5, 6],       // Candle
                    [39, 40, 41, 42],   // Valve
                    [43, 44, 45, 46],   // Pump
                    [47, 48, 49, 50],   // Gravity
                    [51, 52, 53, 54],   // Jump boost
                ];
                for (const group of rotationGroups) {
                    const idx = group.indexOf(id);
                    if (idx !== -1) return idx * Math.PI / 2;
                }
                // Slopes have special rotation mapping to match engine:
                // Engine: ID 30 = top-left solid, 31 = top-right, 32 = bottom-right (base), 33 = bottom-left
                // Editor base texture = bottom-right solid (like ID 32)
                // So: 30 = 180°, 31 = 270°, 32 = 0°, 33 = 90°
                const slopeRotation = { 30: 2, 31: 3, 32: 0, 33: 1, 34: 2, 35: 3, 36: 0, 37: 1 };
                if (slopeRotation[id] !== undefined) return slopeRotation[id] * Math.PI / 2;
                // H-Rings are rotated 90 degrees from V-Rings
                if (id === 15 || id === 16 || id === 23 || id === 24) return Math.PI / 2;
                return 0;
            }

            function drawGrid(startCol, startRow, endCol, endRow, tileSize) {
                // Use fillRect instead of stroke for crisp nearest-neighbor style lines
                // Strokes are always anti-aliased in canvas 2D, but fillRect is not
                ctx.fillStyle = 'rgba(0,80,120,0.5)';

                // Calculate level bounds in screen space
                const levelMinX = Math.round(-camX * zoom);
                const levelMinY = Math.round(-camY * zoom);
                const levelMaxX = Math.round((levelWidth * 12 - camX) * zoom);
                const levelMaxY = Math.round((levelHeight * 12 - camY) * zoom);

                // Draw vertical lines using 1px filled rectangles
                for (let c = Math.max(0, startCol); c <= Math.min(levelWidth, endCol); c++) {
                    const screenX = Math.round((c * 12 - camX) * zoom);
                    ctx.fillRect(screenX, levelMinY, 1, levelMaxY - levelMinY);
                }

                // Draw horizontal lines using 1px filled rectangles
                for (let r = Math.max(0, startRow); r <= Math.min(levelHeight, endRow); r++) {
                    const screenY = Math.round((r * 12 - camY) * zoom);
                    ctx.fillRect(levelMinX, screenY, levelMaxX - levelMinX, 1);
                }
            }

            // Clear any existing door tiles (ID 9, 10, 11, 12) from the map
            function clearOldDoorTiles() {
                for (let i = 0; i < tiles.length; i++) {
                    const tileId = tiles[i] & ~WATER_FLAG;
                    if (tileId >= 9 && tileId <= 12) {
                        tiles[i] = tiles[i] & WATER_FLAG; // Keep water flag, clear tile to 0
                    }
                }
            }

            // ========== INPUT ==========
            let isPanning = false, isDrawing = false, isErasing = false;
            let lastMouseX = 0, lastMouseY = 0;
            let hoverCol = -1, hoverRow = -1;
            let hoverWorldX = 0, hoverWorldY = 0; // Track actual world position for centered placement preview

            function setupEventListeners() {
                // Mouse
                canvas.addEventListener('mousedown', onMouseDown);
                canvas.addEventListener('mousemove', onMouseMove);
                canvas.addEventListener('mouseup', onMouseUp);
                canvas.addEventListener('wheel', onWheel);
                canvas.addEventListener('contextmenu', e => e.preventDefault());

                // Keyboard
                window.addEventListener('keydown', onKeyDown);

                // Resize
                window.addEventListener('resize', resizeCanvas);

                // Sidebar collapse
                document.querySelectorAll('.sidebar-header').forEach(header => {
                    header.addEventListener('click', () => {
                        header.parentElement.classList.toggle('collapsed');
                    });
                });

                // Buttons
                document.getElementById('btnNew').addEventListener('click', newLevel);
                document.getElementById('btnSave').addEventListener('click', openSaveModal);
                document.getElementById('btnLoad').addEventListener('click', openLoadModal);
                document.getElementById('btnResize').addEventListener('click', resizeLevel);
                document.getElementById('btnPlaceDoor').addEventListener('click', placeDoor);
            }

            function onMouseDown(e) {
                const rect = canvas.getBoundingClientRect();
                const worldX = (e.clientX - rect.left) / zoom + camX;
                const worldY = (e.clientY - rect.top) / zoom + camY;
                const col = Math.floor(worldX / 12);
                const row = Math.floor(worldY / 12);

                if (e.button === 1) {
                    isPanning = true;
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                    canvas.style.cursor = 'grabbing';
                    return;
                }

                // Select Mode handling
                if (editorMode === 'select') {
                    if (e.button === 0) {
                        handleSelectModeClick(worldX, worldY, col, row);
                    } else if (e.button === 2) {
                        // Right click deselects
                        selectedObject = null;
                        updateSelectionInfo();
                    }
                    return;
                }

                // Build Mode handling
                if (e.button === 0) {
                    // Handle spider tool states
                    if (selectedTile.isSpider) {
                        // For 2x2 objects, snap to grid intersection (centered placement)
                        // The center of the 2x2 should align with where 4 cells meet
                        const centeredCol = Math.round(worldX / 12) - 1;
                        const centeredRow = Math.round(worldY / 12) - 1;

                        if (spiderToolState === 'placingStart') {
                            pendingSpider = { startCol: centeredCol, startRow: centeredRow };
                            spiderToolState = 'placingEnd';
                        } else if (spiderToolState === 'placingEnd') {
                            // Prevent zero-length trajectory (end same as start)
                            if (centeredCol === pendingSpider.startCol && centeredRow === pendingSpider.startRow) {
                                return; // Don't allow placing end at same position as start
                            }
                            pendingSpider.endCol = centeredCol;
                            pendingSpider.endRow = centeredRow;
                            pendingSpider.offset = 0;
                            spiderToolState = 'settingOffset';
                            draggingSpiderHandle = 'offset';
                        } else if (spiderToolState === 'settingOffset') {
                            pushUndo();
                            spiders.push({
                                startCol: pendingSpider.startCol,
                                startRow: pendingSpider.startRow,
                                endCol: pendingSpider.endCol,
                                endRow: pendingSpider.endRow,
                                offset: pendingSpider.offset,
                                speed: 2
                            });
                            markUnsavedChanges();
                            pendingSpider = null;
                            spiderToolState = 'placingStart';
                            draggingSpiderHandle = null;
                        }
                        return;
                    }

                    isDrawing = true;
                    pushUndo();
                    placeTileAt(e);
                } else if (e.button === 2) {
                    // Right click: cancel spider placement or erase
                    if (spiderToolState !== 'idle' && spiderToolState !== 'placingStart') {
                        spiderToolState = 'placingStart';
                        pendingSpider = null;
                        return;
                    }
                    isErasing = true;
                    pushUndo();
                    eraseTileAt(e);
                }
            }

            // Handle click in select mode
            function handleSelectModeClick(worldX, worldY, col, row) {
                const tileSize = 12;

                // Check if clicking on a spider handle first
                if (selectedObject && selectedObject.type === 'spider') {
                    const spider = spiders[selectedObject.spiderIndex];
                    const handle = getSpiderHandleAt(spider, worldX, worldY);
                    if (handle) {
                        pushUndo();
                        draggingSpiderHandle = handle;
                        return;
                    }
                }

                // Check spiders
                for (let i = spiders.length - 1; i >= 0; i--) {
                    const spider = spiders[i];

                    // Check handles when spider is selected
                    if (selectedObject && selectedObject.type === 'spider' && selectedObject.spiderIndex === i) {
                        const handle = getSpiderHandleAt(spider, worldX, worldY);
                        if (handle) {
                            draggingSpiderHandle = handle;
                            return;
                        }
                    }

                    // Check spider body (using centered coordinates)
                    const startCenterX = spider.startCol * 12 + 12;
                    const startCenterY = spider.startRow * 12 + 12;
                    const endCenterX = spider.endCol * 12 + 12;
                    const endCenterY = spider.endRow * 12 + 12;

                    const trajLengthWorld = Math.sqrt(
                        Math.pow(endCenterX - startCenterX, 2) +
                        Math.pow(endCenterY - startCenterY, 2)
                    );
                    const offset = spider.offset || 0;
                    const t = trajLengthWorld > 0 ? offset / trajLengthWorld : 0;

                    // Spider CENTER position
                    const spCenterX = startCenterX + (endCenterX - startCenterX) * t;
                    const spCenterY = startCenterY + (endCenterY - startCenterY) * t;

                    // Check if click is within spider bounds (24x24 centered on spCenterX/Y)
                    if (worldX >= spCenterX - 12 && worldX < spCenterX + 12 &&
                        worldY >= spCenterY - 12 && worldY < spCenterY + 12) {
                        selectedObject = { type: 'spider', spiderIndex: i };
                        updateSelectionInfo();
                        return;
                    }
                }

                // Check door (2x2)
                if (worldX >= doorCol * 12 && worldX < (doorCol + 2) * 12 &&
                    worldY >= doorRow * 12 && worldY < (doorRow + 2) * 12) {
                    selectedObject = { type: 'door', col: doorCol, row: doorRow };
                    updateSelectionInfo();
                    return;
                }

                // Check spawn
                if (col === spawnCol && row === spawnRow) {
                    selectedObject = { type: 'spawn', col: spawnCol, row: spawnRow };
                    updateSelectionInfo();
                    return;
                }

                // Check tile
                if (col >= 0 && col < levelWidth && row >= 0 && row < levelHeight) {
                    const tileIdx = row * levelWidth + col;
                    const tileId = tiles[tileIdx] & ~WATER_FLAG;
                    if (tileId !== 0) {
                        // Finalize any previous tile movement first
                        finalizeTileMovement();

                        selectedObject = { type: 'tile', col: col, row: row };

                        // Initialize non-destructive movement tracking
                        movingTileOriginalIdx = tileIdx;
                        movingTileValue = tiles[tileIdx];
                        movingTileCurrentIdx = tileIdx;
                        movingTileUnderValue = 0;  // Nothing under at original position

                        updateSelectionInfo();
                        return;
                    }
                }


                // Clicked empty space
                finalizeTileMovement(); // Finalize any pending tile movement
                selectedObject = null;
                updateSelectionInfo();
            }


            // Get which spider handle is at the given world position
            // All handles are at the CENTER of their respective positions
            // OFFSET is checked FIRST so it can be grabbed even when overlapping start/end
            function getSpiderHandleAt(spider, worldX, worldY) {
                const handleRadius = 10;

                // Calculate all positions first
                const startCenterX = spider.startCol * 12 + 12;
                const startCenterY = spider.startRow * 12 + 12;
                const endCenterX = spider.endCol * 12 + 12;
                const endCenterY = spider.endRow * 12 + 12;

                // Calculate offset handle position
                const trajLengthWorld = Math.sqrt(
                    Math.pow(endCenterX - startCenterX, 2) +
                    Math.pow(endCenterY - startCenterY, 2)
                );
                const offset = spider.offset || 0;
                const t = trajLengthWorld > 0 ? offset / trajLengthWorld : 0;
                const spiderCenterX = startCenterX + (endCenterX - startCenterX) * t;
                const spiderCenterY = startCenterY + (endCenterY - startCenterY) * t;

                // Check OFFSET handle FIRST - gives it priority when overlapping with start/end
                if (Math.hypot(worldX - spiderCenterX, worldY - spiderCenterY) < handleRadius) {
                    return SPIDER_HANDLE.OFFSET;
                }

                // Then check start handle
                if (Math.hypot(worldX - startCenterX, worldY - startCenterY) < handleRadius) {
                    return SPIDER_HANDLE.START;
                }

                // Then check end handle
                if (Math.hypot(worldX - endCenterX, worldY - endCenterY) < handleRadius) {
                    return SPIDER_HANDLE.END;
                }

                return null;
            }

            function onMouseMove(e) {
                const rect = canvas.getBoundingClientRect();
                const worldX = (e.clientX - rect.left) / zoom + camX;
                const worldY = (e.clientY - rect.top) / zoom + camY;
                const col = Math.floor(worldX / 12);
                const row = Math.floor(worldY / 12);

                hoverCol = col;
                hoverRow = row;
                hoverWorldX = worldX;
                hoverWorldY = worldY;

                document.getElementById('coordsIndicator').textContent = `${col}, ${row}`;

                if (isPanning) {
                    const dx = e.clientX - lastMouseX;
                    const dy = e.clientY - lastMouseY;
                    camX -= dx / zoom;
                    camY -= dy / zoom;
                    clampCamera();
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                    hoverCol = -1;
                    hoverRow = -1;
                } else if (editorMode === 'select' && draggingSpiderHandle && selectedObject && selectedObject.type === 'spider') {
                    // Dragging spider handle - use centered grid for start/end (2x2 objects)
                    const spider = spiders[selectedObject.spiderIndex];
                    const centeredCol = Math.round(worldX / 12) - 1;
                    const centeredRow = Math.round(worldY / 12) - 1;

                    if (draggingSpiderHandle === SPIDER_HANDLE.START) {
                        // Prevent zero-length trajectory
                        if (centeredCol === spider.endCol && centeredRow === spider.endRow) {
                            return; // Don't allow moving start to same position as end
                        }
                        // Calculate old trajectory length and offset ratio
                        const oldLength = Math.sqrt(
                            Math.pow((spider.endCol - spider.startCol) * 12, 2) +
                            Math.pow((spider.endRow - spider.startRow) * 12, 2)
                        );
                        const offsetRatio = oldLength > 0 ? (spider.offset || 0) / oldLength : 0;

                        // Update position
                        spider.startCol = centeredCol;
                        spider.startRow = centeredRow;

                        // Recalculate offset to maintain same relative position
                        const newLength = Math.sqrt(
                            Math.pow((spider.endCol - spider.startCol) * 12, 2) +
                            Math.pow((spider.endRow - spider.startRow) * 12, 2)
                        );
                        spider.offset = Math.round(offsetRatio * newLength);
                    } else if (draggingSpiderHandle === SPIDER_HANDLE.END) {
                        // Prevent zero-length trajectory
                        if (centeredCol === spider.startCol && centeredRow === spider.startRow) {
                            return; // Don't allow moving end to same position as start
                        }
                        // Calculate old trajectory length and offset ratio
                        const oldLength = Math.sqrt(
                            Math.pow((spider.endCol - spider.startCol) * 12, 2) +
                            Math.pow((spider.endRow - spider.startRow) * 12, 2)
                        );
                        const offsetRatio = oldLength > 0 ? (spider.offset || 0) / oldLength : 0;

                        // Update position
                        spider.endCol = centeredCol;
                        spider.endRow = centeredRow;

                        // Recalculate offset to maintain same relative position
                        const newLength = Math.sqrt(
                            Math.pow((spider.endCol - spider.startCol) * 12, 2) +
                            Math.pow((spider.endRow - spider.startRow) * 12, 2)
                        );
                        spider.offset = Math.round(offsetRatio * newLength);
                    } else if (draggingSpiderHandle === SPIDER_HANDLE.OFFSET) {
                        // Calculate offset using center points
                        spider.offset = calculateOffsetAlongLine(
                            spider.startCol * 12 + 12, spider.startRow * 12 + 12,
                            spider.endCol * 12 + 12, spider.endRow * 12 + 12,
                            worldX, worldY
                        );
                    }
                    updateSelectionInfo();
                } else if (spiderToolState === 'settingOffset' && pendingSpider) {
                    // Use center coordinates for offset calculation
                    pendingSpider.offset = calculateOffsetAlongLine(
                        pendingSpider.startCol * 12 + 12, pendingSpider.startRow * 12 + 12,
                        pendingSpider.endCol * 12 + 12, pendingSpider.endRow * 12 + 12,
                        worldX, worldY
                    );
                } else if (isDrawing) {
                    placeTileAt(e);
                } else if (isErasing) {
                    eraseTileAt(e);
                }
            }

            // Calculate offset in PIXELS along a line segment
            function calculateOffsetAlongLine(x1, y1, x2, y2, mouseX, mouseY) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const length = Math.sqrt(dx * dx + dy * dy);
                if (length === 0) return 0;

                const t = ((mouseX - x1) * dx + (mouseY - y1) * dy) / (length * length);
                const clampedT = Math.max(0, Math.min(1, t));
                return Math.round(clampedT * length);
            }

            function onMouseUp(e) {
                isPanning = false;
                isDrawing = false;
                isErasing = false;
                draggingSpiderHandle = null;

                if (editorMode === 'build') {
                    canvas.style.cursor = 'crosshair';
                } else {
                    canvas.style.cursor = 'pointer';
                }
            }

            function onWheel(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const worldX = mouseX / zoom + camX;
                const worldY = mouseY / zoom + camY;

                if (e.deltaY < 0) {
                    zoom = Math.min(MAX_ZOOM, zoom * 1.2);
                } else {
                    zoom = Math.max(MIN_ZOOM, zoom / 1.2);
                }

                camX = worldX - mouseX / zoom;
                camY = worldY - mouseY / zoom;
                clampCamera();

                document.getElementById('zoomIndicator').textContent = zoom.toFixed(1) + '×';
            }

            function onKeyDown(e) {
                // Ignore keyboard controls when typing in input fields
                const activeEl = document.activeElement;
                const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');
                if (isTyping && e.key !== 'Escape') {
                    return; // Allow Escape to blur inputs, but don't process other keys
                }

                // Undo / Redo
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) {
                    e.preventDefault();
                    redo();
                    return;
                }

                // Mode switching
                if (e.key === 'b' || e.key === 'B') {
                    setEditorMode('build');
                    return;
                }
                if (e.key === 'v' || e.key === 'V') {
                    setEditorMode('select');
                    return;
                }

                // Escape to deselect
                if (e.key === 'Escape') {
                    finalizeTileMovement(); // Finalize any pending tile movement
                    selectedObject = null;
                    updateSelectionInfo();
                    // Also cancel spider placement
                    if (spiderToolState !== 'idle') {
                        spiderToolState = 'placingStart';
                        pendingSpider = null;
                    }
                    return;
                }


                // Select mode controls
                if (editorMode === 'select' && selectedObject) {
                    // WASD movement
                    const moveAmount = e.shiftKey ? 5 : 1;
                    let moved = false;

                    if (e.key === 'w' || e.key === 'W') {
                        if (!e.repeat) pushUndo();
                        moveSelectedObject(0, -moveAmount);
                        moved = true;
                    } else if (e.key === 's' || e.key === 'S') {
                        if (!e.repeat) pushUndo();
                        moveSelectedObject(0, moveAmount);
                        moved = true;
                    } else if (e.key === 'a' || e.key === 'A') {
                        if (!e.repeat) pushUndo();
                        moveSelectedObject(-moveAmount, 0);
                        moved = true;
                    } else if (e.key === 'd' || e.key === 'D') {
                        if (!e.repeat) pushUndo();
                        moveSelectedObject(moveAmount, 0);
                        moved = true;
                    }

                    // Q/E rotation
                    if (e.key === 'q' || e.key === 'Q') {
                        if (!e.repeat) pushUndo();
                        rotateSelectedObject(-1);
                        moved = true;
                    } else if (e.key === 'e' || e.key === 'E') {
                        if (!e.repeat) pushUndo();
                        rotateSelectedObject(1);
                        moved = true;
                    }

                    // Delete key
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        pushUndo();
                        deleteSelectedObject();
                        moved = true;
                    }

                    if (moved) {
                        e.preventDefault();
                        updateSelectionInfo();
                        return;
                    }
                }

                // Build mode rotation
                if (e.key === 'r' || e.key === 'R') {
                    if (editorMode === 'build') {
                        rotateSelectedTileOrHovered();
                    }
                }
            }

            // Finalize tile movement - called when deselecting or switching tiles
            // Clears the original position if the tile moved, and resets tracking state
            function finalizeTileMovement() {
                if (movingTileOriginalIdx === -1) return; // No tile being moved

                // If tile moved to a different position, clear original (it's no longer there)
                if (movingTileCurrentIdx !== movingTileOriginalIdx) {
                    // Original position should be empty (the tile moved away)
                    tiles[movingTileOriginalIdx] = 0;
                }

                // Reset tracking state
                movingTileOriginalIdx = -1;
                movingTileValue = 0;
                movingTileUnderValue = 0;
                movingTileCurrentIdx = -1;
            }

            // Move selected object by delta cells

            function moveSelectedObject(dx, dy) {
                if (!selectedObject) return;

                if (selectedObject.type === 'tile') {
                    const newCol = Math.max(0, Math.min(levelWidth - 1, selectedObject.col + dx));
                    const newRow = Math.max(0, Math.min(levelHeight - 1, selectedObject.row + dy));
                    const newIdx = newRow * levelWidth + newCol;

                    if (newIdx !== movingTileCurrentIdx) {
                        // Restore what was under the previous position
                        tiles[movingTileCurrentIdx] = movingTileUnderValue;

                        // Save what's at the new position (before overwriting)
                        movingTileUnderValue = tiles[newIdx];

                        // Write the moving tile at the new position
                        tiles[newIdx] = movingTileValue;

                        // Update tracking
                        movingTileCurrentIdx = newIdx;
                        selectedObject.col = newCol;
                        selectedObject.row = newRow;

                        markUnsavedChanges();
                    }
                } else if (selectedObject.type === 'spawn') {

                    spawnCol = Math.max(0, Math.min(levelWidth - 1, spawnCol + dx));
                    spawnRow = Math.max(0, Math.min(levelHeight - 1, spawnRow + dy));
                    document.getElementById('spawnCol').value = spawnCol;
                    document.getElementById('spawnRow').value = spawnRow;
                    selectedObject.col = spawnCol;
                    selectedObject.row = spawnRow;
                } else if (selectedObject.type === 'door') {
                    clearOldDoorTiles();
                    doorCol = Math.max(0, Math.min(levelWidth - 2, doorCol + dx));
                    doorRow = Math.max(0, Math.min(levelHeight - 2, doorRow + dy));
                    document.getElementById('doorCol').value = doorCol;
                    document.getElementById('doorRow').value = doorRow;
                    // Place door tiles at new position
                    for (let dr = 0; dr < 2; dr++) {
                        for (let dc = 0; dc < 2; dc++) {
                            tiles[(doorRow + dr) * levelWidth + doorCol + dc] = 9;
                        }
                    }
                    selectedObject.col = doorCol;
                    selectedObject.row = doorRow;
                } else if (selectedObject.type === 'spider') {
                    const spider = spiders[selectedObject.spiderIndex];
                    spider.startCol += dx;
                    spider.startRow += dy;
                    spider.endCol += dx;
                    spider.endRow += dy;
                }
            }

            // Rotate selected object
            function rotateSelectedObject(direction) {
                if (!selectedObject) return;

                if (selectedObject.type === 'tile') {
                    const idx = selectedObject.row * levelWidth + selectedObject.col;
                    const currentTileVal = tiles[idx];
                    const currentTileId = currentTileVal & ~WATER_FLAG;

                    for (const category of Object.values(TILE_DEFS)) {
                        for (const tile of category) {
                            if (tile.rotatable && tile.rotations) {
                                const rotIdx = tile.rotations.indexOf(currentTileId);
                                if (rotIdx !== -1) {
                                    const nextIdx = (rotIdx + direction + tile.rotations.length) % tile.rotations.length;
                                    const water = currentTileVal & WATER_FLAG;
                                    tiles[idx] = tile.rotations[nextIdx] | water;
                                    return;
                                }
                            }
                        }
                    }
                }
            }

            // Delete selected object
            function deleteSelectedObject() {
                if (!selectedObject) return;

                if (selectedObject.type === 'tile') {
                    const idx = selectedObject.row * levelWidth + selectedObject.col;
                    tiles[idx] = 0;
                    markUnsavedChanges();
                    selectedObject = null;
                } else if (selectedObject.type === 'spider') {
                    spiders.splice(selectedObject.spiderIndex, 1);
                    markUnsavedChanges();
                    selectedObject = null;
                }
            }

            // Rotate in build mode
            function rotateSelectedTileOrHovered() {
                // First try to rotate selected tool
                if (selectedTile.rotatable && selectedTile.rotations) {
                    currentRotation = (currentRotation + 1) % selectedTile.rotations.length;
                    return;
                }

                // Then try to rotate hovered tile
                if (hoverCol >= 0 && hoverCol < levelWidth && hoverRow >= 0 && hoverRow < levelHeight) {
                    const idx = hoverRow * levelWidth + hoverCol;
                    const currentTileVal = tiles[idx];
                    const currentTileId = currentTileVal & ~WATER_FLAG;
                    if (currentTileId === 0) return;

                    for (const category of Object.values(TILE_DEFS)) {
                        for (const tile of category) {
                            if (tile.rotatable && tile.rotations) {
                                const rotIdx = tile.rotations.indexOf(currentTileId);
                                if (rotIdx !== -1) {
                                    pushUndo();
                                    const nextIdx = (rotIdx + 1) % tile.rotations.length;
                                    const water = currentTileVal & WATER_FLAG;
                                    tiles[idx] = tile.rotations[nextIdx] | water;
                                    return;
                                }
                            }
                        }
                    }
                }
            }

            function clampCamera() {
                const viewportWidth = canvas.width / zoom;
                const viewportHeight = canvas.height / zoom;
                const levelPixelWidth = levelWidth * 12;
                const levelPixelHeight = levelHeight * 12;
                const padding = 48;

                if (levelPixelWidth <= viewportWidth) {
                    camX = (levelPixelWidth - viewportWidth) / 2;
                } else {
                    const minX = -padding;
                    const maxX = levelPixelWidth - viewportWidth + padding;
                    camX = Math.max(minX, Math.min(maxX, camX));
                }

                if (levelPixelHeight <= viewportHeight) {
                    camY = (levelPixelHeight - viewportHeight) / 2;
                } else {
                    const minY = -padding;
                    const maxY = levelPixelHeight - viewportHeight + padding;
                    camY = Math.max(minY, Math.min(maxY, camY));
                }
            }

            function placeTileAt(e) {
                const rect = canvas.getBoundingClientRect();
                const worldX = (e.clientX - rect.left) / zoom + camX;
                const worldY = (e.clientY - rect.top) / zoom + camY;
                const col = Math.floor(worldX / 12);
                const row = Math.floor(worldY / 12);

                if (col < 0 || col >= levelWidth || row < 0 || row >= levelHeight) return;

                let tileId = selectedTile.id;

                // Handle rotation
                if (selectedTile.rotatable && selectedTile.rotations) {
                    tileId = selectedTile.rotations[currentRotation];
                }

                // Handle water flag (Add water)
                if (selectedTile.isFlag && selectedTile.id === 64) {
                    // Don't add water to blocks, trampolines, or hollow blocks
                    const existingTileId = tiles[row * levelWidth + col] & ~WATER_FLAG;
                    if (existingTileId !== 1 && existingTileId !== 2 && existingTileId !== 56) {
                        tiles[row * levelWidth + col] |= WATER_FLAG;
                    }
                    return;
                }

                // Handle spawn point placement
                if (selectedTile.isSpawn) {
                    spawnCol = col;
                    spawnRow = row;
                    document.getElementById('spawnCol').value = spawnCol;
                    document.getElementById('spawnRow').value = spawnRow;
                    return;
                }

                // Handle multi-tile objects with centered placement
                if (selectedTile.multiTile) {
                    if (selectedTile.multiTile === 'vring' || selectedTile.multiTile === 'bigvring') {
                        // 1x2 vertical ring: center vertically
                        const centeredRow = Math.max(0, Math.min(levelHeight - 2, Math.round(worldY / 12) - 1));
                        // Preserve water flag for rings
                        const water0 = tiles[centeredRow * levelWidth + col] & WATER_FLAG;
                        tiles[centeredRow * levelWidth + col] = selectedTile.ids[0] | water0;
                        if (centeredRow + 1 < levelHeight) {
                            const water1 = tiles[(centeredRow + 1) * levelWidth + col] & WATER_FLAG;
                            tiles[(centeredRow + 1) * levelWidth + col] = selectedTile.ids[1] | water1;
                        }
                    } else if (selectedTile.multiTile === 'hring' || selectedTile.multiTile === 'bighring') {
                        // 2x1 horizontal ring: center horizontally
                        const centeredCol = Math.max(0, Math.min(levelWidth - 2, Math.round(worldX / 12) - 1));
                        // Preserve water flag for rings
                        const water0 = tiles[row * levelWidth + centeredCol] & WATER_FLAG;
                        tiles[row * levelWidth + centeredCol] = selectedTile.ids[0] | water0;
                        if (centeredCol + 1 < levelWidth) {
                            const water1 = tiles[row * levelWidth + centeredCol + 1] & WATER_FLAG;
                            tiles[row * levelWidth + centeredCol + 1] = selectedTile.ids[1] | water1;
                        }
                    } else if (selectedTile.multiTile === 'door') {
                        // Clear any existing door tiles first
                        clearOldDoorTiles();
                        // Use centered grid snapping for 2x2 door
                        const centeredCol = Math.max(0, Math.min(levelWidth - 2, Math.round(worldX / 12) - 1));
                        const centeredRow = Math.max(0, Math.min(levelHeight - 2, Math.round(worldY / 12) - 1));
                        doorCol = centeredCol;
                        doorRow = centeredRow;
                        document.getElementById('doorCol').value = centeredCol;
                        document.getElementById('doorRow').value = centeredRow;
                        // Place door tiles
                        for (let dr = 0; dr < 2; dr++) {
                            for (let dc = 0; dc < 2; dc++) {
                                if (centeredRow + dr < levelHeight && centeredCol + dc < levelWidth) {
                                    tiles[(centeredRow + dr) * levelWidth + centeredCol + dc] = 9;
                                }
                            }
                        }
                    }
                    return;
                }

                // Preserve water flag - except for blocks and trampolines which cannot be waterlogged
                const existingWater = tiles[row * levelWidth + col] & WATER_FLAG;
                const cannotBeWaterlogged = (tileId === 1 || tileId === 2 || tileId === 56);
                tiles[row * levelWidth + col] = cannotBeWaterlogged ? tileId : (tileId | existingWater);
                markUnsavedChanges();
            }


            function eraseTileAt(e) {
                const rect = canvas.getBoundingClientRect();
                const worldX = (e.clientX - rect.left) / zoom + camX;
                const worldY = (e.clientY - rect.top) / zoom + camY;
                const col = Math.floor(worldX / 12);
                const row = Math.floor(worldY / 12);

                if (col < 0 || col >= levelWidth || row < 0 || row >= levelHeight) return;

                // Prioritize removing water flag first, unless it's a non-waterloggable block
                const val = tiles[row * levelWidth + col];
                const tileId = val & ~WATER_FLAG;
                const cannotBeWaterlogged = (tileId === 1 || tileId === 2 || tileId === 56);

                if (cannotBeWaterlogged) {
                    // These blocks shouldn't have water - remove entire tile in one click
                    tiles[row * levelWidth + col] = 0;
                } else if ((val & WATER_FLAG) !== 0) {
                    // Remove water, keep tile
                    tiles[row * levelWidth + col] = val & ~WATER_FLAG;
                } else {
                    // Remove tile
                    tiles[row * levelWidth + col] = 0;
                }
            }

            // RLE tile compression — header 'RL' followed by (value, count) pairs
            // Count uses variable-length encoding: counts 1-255 fit in one byte,
            // larger runs are split into multiple pairs.
            function rlEncodeTiles(tiles) {
                const out = [82, 76]; // 'R','L' header
                let i = 0;
                while (i < tiles.length) {
                    const val = tiles[i];
                    let count = 1;
                    while (i + count < tiles.length && tiles[i + count] === val && count < 255) {
                        count++;
                    }
                    out.push(val, count);
                    i += count;
                }
                return btoa(String.fromCharCode(...out));
            }

            // Decode tiles — auto-detects RLE (header 'RL') vs legacy raw base64
            function rleDecodeTiles(encoded, expectedSize) {
                const raw = atob(encoded);
                const tiles = new Uint8Array(expectedSize);
                // Check for 'RL' header
                if (raw.length >= 2 && raw.charCodeAt(0) === 82 && raw.charCodeAt(1) === 76) {
                    let pos = 2, idx = 0;
                    while (pos + 1 < raw.length && idx < expectedSize) {
                        const val = raw.charCodeAt(pos);
                        const count = raw.charCodeAt(pos + 1);
                        const end = Math.min(idx + count, expectedSize);
                        tiles.fill(val, idx, end);
                        idx = end;
                        pos += 2;
                    }
                } else {
                    // Legacy: raw bytes
                    const len = Math.min(raw.length, expectedSize);
                    for (let i = 0; i < len; i++) {
                        tiles[i] = raw.charCodeAt(i);
                    }
                }
                return tiles;
            }

            // ========== AUTO-SAVE (IndexedDB) ==========
            const DEBOUNCE_DELAY = 300; // Save 300ms after last change (responsive yet efficient)
            let debounceTimer = null;
            let hasUnsavedChanges = false;
            let lastSavedData = null; // Track last saved state to avoid redundant writes
            let pendingAutosave = null; // Track pending autosave promise

            async function autoSave(force = false) {
                if (!hasUnsavedChanges && !force) return;

                try {
                    const levelData = getLevelData();
                    levelData.autosavedAt = new Date().toISOString();
                    levelData.currentLevelId = currentLevelId; // Track if editing existing level

                    // Serialize once for comparison
                    const serialized = JSON.stringify(levelData);

                    // Skip if data hasn't actually changed (prevents redundant writes)
                    if (!force && serialized === lastSavedData) {
                        hasUnsavedChanges = false;
                        return;
                    }

                    // Save to IndexedDB
                    pendingAutosave = BounceStorage.saveAutosave(levelData);
                    await pendingAutosave;
                    pendingAutosave = null;

                    lastSavedData = serialized;
                    hasUnsavedChanges = false;
                    console.log('Auto-saved at', new Date().toLocaleTimeString());
                } catch (e) {
                    console.warn('Auto-save failed:', e);
                    pendingAutosave = null;
                }
            }

            // Debounced save - triggers 300ms after the last change
            // This ensures: instant refresh still saves (via beforeunload/visibilitychange)
            // while preventing excessive writes during rapid edits
            function markUnsavedChanges() {
                hasUnsavedChanges = true;

                // Clear existing timer
                if (debounceTimer) {
                    clearTimeout(debounceTimer);
                }

                // Schedule save after debounce delay
                debounceTimer = setTimeout(() => {
                    autoSave();
                }, DEBOUNCE_DELAY);
            }

            // Immediate sync save for critical moments (page unload)
            function saveImmediately() {
                if (debounceTimer) {
                    clearTimeout(debounceTimer);
                    debounceTimer = null;
                }
                // Note: We trigger the save but can't await in beforeunload
                // IndexedDB transactions may complete even after page starts unloading
                autoSave(true);
            }

            function startAutoSave() {
                // Save on page unload - multiple fallbacks for reliability
                window.addEventListener('beforeunload', saveImmediately);

                // visibilitychange is more reliable than beforeunload in modern browsers
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        saveImmediately();
                    }
                });

                // pagehide is the most reliable event for mobile and bfcache
                window.addEventListener('pagehide', saveImmediately);
            }

            async function checkAutoSave() {
                try {
                    // First, migrate any existing localStorage data to IndexedDB
                    await BounceStorage.migrateFromLocalStorage();

                    const data = await BounceStorage.getAutosave();
                    if (!data) return;

                    applyLevelData(data);
                    console.log('Restored auto-saved session from IndexedDB');
                } catch (e) {
                    console.warn('Failed to restore auto-save:', e);
                    // Try to clear corrupted data
                    BounceStorage.clearAutosave().catch(() => { });
                }
            }

            async function clearAutoSave() {

                }

            }

            async function saveToServer() {
                const token = getSessionToken();
                if (!token) {
                    showMessage('You must be logged in to upload levels.\n\nPlease log in on the main page first, then return to the editor.');
                    return;
                }

                const levelData = getLevelData();

                // Always POST — the API handles name-based deduplication.
                // Check if same-name level exists first to warn the user.
                try {
                    const checkRes = await fetch(`${API_BASE}/levels?per_page=1&search=${encodeURIComponent(levelData.name)}`, { cache: 'no-cache' });
                    if (checkRes.ok) {
                        const checkData = await checkRes.json();
                        const match = checkData.levels.find(l => l.name === levelData.name);
                        if (match) {
                            if (!await showDangerConfirm(`An online level named "${levelData.name}" already exists (by ${match.creator_name}).\n\nUploading will OVERWRITE the existing level data. This cannot be undone.`)) {
                                return;
                            }
                        }
                    }
                } catch (e) {
                    // If check fails, proceed anyway — server will handle it
                }

                try {
                    const response = await fetch(`${API_BASE}/levels`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(levelData)
                    });

                    const result = await response.json();

                    if (response.status === 401) {
                        currentUser = null;
                        updateUploadButtonState();
                        showMessage('Your session has expired. Please log in again on the main page.');
                        return;
                    }

                    if (!response.ok) throw new Error(result.error || 'Failed to save');

                    if (result.id) currentLevelId = result.id;
                    clearAutoSave();
                    closeSaveModal();

                    const msg = result.overwritten ? 'Level overwritten successfully!' : 'Level uploaded successfully!';
                    showMessage(msg);
                } catch (err) {
                    console.error('Save error:', err);
                    showMessage('Failed to upload to server: ' + err.message);
                }
            }

            async function loadOnlineLevels() {

            async function loadLocalLevels() {
                const listEl = document.getElementById('levelList');
                listEl.innerHTML = '<div class="level-list-empty">Loading...</div>';

                try {
                    const localLevels = await BounceStorage.getLevels();

                    if (localLevels.length === 0) {
                        listEl.innerHTML = '<div class="level-list-empty">No local levels saved</div>';
                        return;
                    }

                    // Sort by savedAt descending (newest first)
                    localLevels.sort((a, b) => {
                        const dateA = a.savedAt ? new Date(a.savedAt) : new Date(0);
                        const dateB = b.savedAt ? new Date(b.savedAt) : new Date(0);
                        return dateB - dateA;
                    });

                    listEl.innerHTML = localLevels.map((level) => `
                    <div class="level-item">
                        <div class="level-item-name">${escapeHtml(level.name)}</div>
                        <div class="level-item-meta">${level.width}×${level.height} • ${formatDate(level.savedAt)}</div>

                            <button class="btn btn-tiny btn-danger" onclick="deleteLocalLevel('${escapeHtml(level.name).replace(/'/g, "\\'")}')">Delete</button>

            // Helper functions
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatDate(dateStr) {
                if (!dateStr) return 'Unknown';
                const date = new Date(dateStr);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function applyLevelData(data) {
                document.getElementById('levelName').value = data.name || 'Untitled';
                levelWidth = data.width;
                levelHeight = data.height;
                document.getElementById('levelWidth').value = levelWidth;

                // Calculate level from height (reverse of calculateHeight)
                currentLevel = Math.max(1, Math.min(MAX_LEVEL, Math.round((levelHeight - BASE_HEIGHT) / HEIGHT_PER_LEVEL + 1)));
                document.getElementById('levelInput').value = currentLevel;
                updateHeightDisplay();

                // Decode tiles — handles both RLE-compressed and legacy raw base64
                const expectedSize = levelWidth * levelHeight;
                tiles = rleDecodeTiles(data.tiles, expectedSize);

                spawnCol = Math.floor((data.spawnX !== undefined ? data.spawnX : 30) / 12);
                spawnRow = Math.floor((data.spawnY !== undefined ? data.spawnY : 30) / 12);
                spawnSize = data.spawnSize;
                document.getElementById('spawnCol').value = spawnCol;
                document.getElementById('spawnRow').value = spawnRow;
                setSpawnSizeValue(spawnSize);

                doorCol = data.doorCol;
                doorRow = data.doorRow;
                document.getElementById('doorCol').value = doorCol;
                document.getElementById('doorRow').value = doorRow;

                spiders = data.spiders || [];

                centerCamera();
            }

            // ========== SETUP MODAL LISTENERS ==========
            function setupModalListeners() {
                // Save modal
                document.getElementById('btnSaveCancel').addEventListener('click', closeSaveModal);
                document.getElementById('btnSaveLocal').addEventListener('click', saveToLocalStorage);
                document.getElementById('btnSaveUpload').addEventListener('click', saveToServer);

                // Load modal
                document.getElementById('btnLoadCancel').addEventListener('click', closeLoadModal);
                document.getElementById('tabOnline').addEventListener('click', () => setLoadTab('online'));
                document.getElementById('tabLocal').addEventListener('click', () => setLoadTab('local'));

                // Close modals on overlay click
                document.getElementById('saveModal').addEventListener('click', (e) => {
                    if (e.target.id === 'saveModal') closeSaveModal();
                });
                document.getElementById('loadModal').addEventListener('click', (e) => {
                    if (e.target.id === 'loadModal') closeLoadModal();
                });
            }

            // ========== START ==========
            setupModalListeners();
            init();
        } // end bootEditorApp

        // Boot immediately if editor was already mounted, otherwise wait for mount event
        if (window.__editorReady) {
            bootEditorApp();
        } else {
            window.addEventListener('editor-mount', function () {
                bootEditorApp();
            });
        }
    </script>
</body>

</html>
