<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BouncEngine</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="BouncEngine">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BouncEngine">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- PWA Links -->
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <script>
        // Disable all refresh and DevTools keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            const key = e.key.toLowerCase();
            const ctrl = e.ctrlKey || e.metaKey;
            const shift = e.shiftKey;

            // Block refresh: F5, Ctrl+R, Ctrl+Shift+R
            if (e.key === 'F5' || (ctrl && key === 'r')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // Block DevTools: F12, Ctrl+Shift+I/J/C/K/E/M/D, Ctrl+U
            if (
                e.key === 'F12' ||
                (ctrl && shift && ['i', 'j', 'c', 'k', 'e', 'm', 'd'].includes(key)) ||
                (ctrl && key === 'u')
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
        // Disable Context Menu (Right-Click) to prevent "Inspect" and "Reload"
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        // Mobile fullscreen removed - users can manually fullscreen if desired
    </script>

    <style>
        @font-face {
            font-family: 'Raylib';
            src: url('../raylib.ttf') format('opentype');
        }

        /* Mobile PWA optimizations */
        html,
        body {
            /* Disable text selection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* Disable touch callout (iOS long-press menu) */
            -webkit-touch-callout: none;
            /* Disable tap highlight */
            -webkit-tap-highlight-color: transparent;
            /* Disable double-tap zoom delay */
            touch-action: manipulation;
            /* Prevent overscroll/bounce */
            overscroll-behavior: none;
            /* Fill entire viewport */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        canvas {
            image-rendering: pixelated;
            visibility: hidden;
            /* Prevent all touch gestures on canvas */
            touch-action: none;
        }

        /* Use a transparent 1×1 cursor image — browsers apply custom cursor
           images immediately on page load, unlike cursor:none which waits
           for a mousemove event before taking visual effect */
        canvas {
            cursor: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=') 0 0, none;
        }

        canvas.ready {
            visibility: visible;
        }

        /* Pause overlay and its children must show the cursor */
        canvas.show-cursor,
        .pause-overlay,
        .pause-overlay * {
            cursor: default;
        }

        /* ========== PIXELATED CORNER CLIP (removes 1 corner pixel) ========== */
        .pixel-corners {
            clip-path: polygon(
                    /* Top edge - skip first pixel */
                    4px 0%, 100% 0%,
                    /* Right edge - skip top-right corner pixel, go down */
                    100% 0%, calc(100% - 4px) 0%,
                    100% 4px, 100% calc(100% - 4px),
                    /* Bottom edge - skip bottom-right corner pixel */
                    calc(100% - 4px) 100%, 4px 100%,
                    /* Left edge - skip bottom-left corner pixel, go up */
                    0% calc(100% - 4px), 0% 4px);
        }

        /* Mobile controls - only shown on mobile devices */
        .mobile-ctrl-btn {
            position: fixed;
            padding: 0;
            cursor: pointer;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.25) 0%,
                    rgba(255, 255, 255, 0.08) 30%,
                    rgba(0, 0, 0, 0.1) 70%,
                    rgba(0, 0, 0, 0.2) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: none;
            z-index: 500;
            display: none;
            outline: none;
            /* Pixelated corners - clip 4px from each corner */
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%,
                    100% 4px, 100% calc(100% - 4px),
                    calc(100% - 4px) 100%, 4px 100%,
                    0% calc(100% - 4px), 0% 4px);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .mobile-ctrl-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: rgba(255, 255, 255, 0.4);
            border-bottom-color: rgba(0, 0, 0, 0.3);
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%,
                    100% 4px, 100% calc(100% - 4px),
                    calc(100% - 4px) 100%, 4px 100%,
                    0% calc(100% - 4px), 0% 4px);
            pointer-events: none;
        }

        .mobile-ctrl-btn::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 6px;
            right: 6px;
            height: 40%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    rgba(255, 255, 255, 0.05) 50%,
                    transparent 100%);
            pointer-events: none;
        }

        .mobile-ctrl-btn img {
            display: block;
            image-rendering: pixelated;
            mix-blend-mode: overlay;
            opacity: 0.5;
        }

        .mobile-ctrl-btn:active {
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.1) 0%,
                    rgba(0, 0, 0, 0.05) 30%,
                    rgba(255, 255, 255, 0.05) 70%,
                    rgba(255, 255, 255, 0.1) 100%);
        }

        .mobile-ctrl-btn:active::before {
            border-top-color: rgba(0, 0, 0, 0.2);
            border-left-color: rgba(0, 0, 0, 0.15);
            border-bottom-color: rgba(255, 255, 255, 0.2);
            border-right-color: rgba(255, 255, 255, 0.15);
        }

        /* Support JS-applied 'pressed' class so multiple buttons can show pressed state */
        .mobile-ctrl-btn.pressed {
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.1) 0%,
                    rgba(0, 0, 0, 0.05) 30%,
                    rgba(255, 255, 255, 0.05) 70%,
                    rgba(255, 255, 255, 0.1) 100%);
        }

        .mobile-ctrl-btn.pressed::before {
            border-top-color: rgba(0, 0, 0, 0.2);
            border-left-color: rgba(0, 0, 0, 0.15);
            border-bottom-color: rgba(255, 255, 255, 0.2);
            border-right-color: rgba(255, 255, 255, 0.15);
        }

        /* Pause button - top left, inset for iPhone safe area */
        .mobile-pause-btn {
            top: max(env(safe-area-inset-top, 0px), 12px);
            left: max(env(safe-area-inset-left, 0px), 12px);
            width: clamp(32px, 8vw, 40px);
            height: clamp(32px, 8vw, 40px);
        }

        .mobile-pause-btn img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Direction buttons - centered in the gap between screen edge and canvas */
        /* --side-gap is set by JS in updateCanvasSize() */
        /* Group = 2 buttons + spacing. Center of left gap = --side-gap / 2 */
        /* Left btn: gapCenter - btnSize - spacing/2 */
        /* Right btn: gapCenter + spacing/2 */
        .mobile-move-left {
            bottom: max(env(safe-area-inset-bottom, 0px), clamp(36px, 8vh, 52px));
            left: calc(var(--side-gap, 25%) / 2 - clamp(48px, 13vw, 64px) - clamp(10px, 2.5vw, 16px));
            width: clamp(48px, 13vw, 64px);
            height: clamp(48px, 13vw, 64px);
        }

        .mobile-move-right {
            bottom: max(env(safe-area-inset-bottom, 0px), clamp(36px, 8vh, 52px));
            left: calc(var(--side-gap, 25%) / 2 + clamp(10px, 2.5vw, 16px));
            width: clamp(48px, 13vw, 64px);
            height: clamp(48px, 13vw, 64px);
        }

        .mobile-move-left img,
        .mobile-move-right img,
        .mobile-jump-btn img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Jump button - bottom right, centered in right gap, vertically centered with direction buttons */
        .mobile-jump-btn {
            bottom: calc(max(env(safe-area-inset-bottom, 0px), clamp(36px, 8vh, 52px)) - (clamp(64px, 17vw, 80px) - clamp(48px, 13vw, 64px)) / 2);
            right: calc(var(--side-gap, 25%) / 2 - clamp(64px, 17vw, 80px) / 2);
            width: clamp(64px, 17vw, 80px);
            height: clamp(64px, 17vw, 80px);
        }

        /* ========== PAUSE MENU SYSTEM ========== */
        .pause-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
        }

        .pause-overlay.active {
            display: flex;
            opacity: 1;
        }

        .pause-overlay.fading-in {
            display: flex;
        }

        .pause-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .pause-title {
            font-family: 'Raylib', monospace;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 8px;
            filter: blur(4px);
            transition: filter 0.1s ease-in-out;
        }

        .pause-overlay.active .pause-title {
            filter: blur(0);
        }

        /* Glass button style - pixelated corners */
        .pause-btn {
            font-family: 'Raylib', monospace;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.25) 0%,
                    rgba(255, 255, 255, 0.08) 30%,
                    rgba(0, 0, 0, 0.1) 70%,
                    rgba(0, 0, 0, 0.2) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: none;
            padding: 12px 0;
            cursor: pointer;
            position: relative;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), 0 0 4px rgba(0, 0, 0, 0.5);
            outline: none;
            width: 160px;
            text-align: center;
            /* Pixelated corners - clip 4px from each corner */
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%,
                    100% 4px, 100% calc(100% - 4px),
                    calc(100% - 4px) 100%, 4px 100%,
                    0% calc(100% - 4px), 0% 4px);
            /* Blur transition */
            filter: blur(4px);
            transition: filter 0.1s ease-in-out, background 0.1s ease;
            /* Mobile: eliminate double-tap delay */
            touch-action: manipulation;
        }

        .pause-overlay.active .pause-btn {
            filter: blur(0);
        }

        .pause-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: rgba(255, 255, 255, 0.4);
            border-bottom-color: rgba(0, 0, 0, 0.3);
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%,
                    100% 4px, 100% calc(100% - 4px),
                    calc(100% - 4px) 100%, 4px 100%,
                    0% calc(100% - 4px), 0% 4px);
            pointer-events: none;
        }

        .pause-btn::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 8px;
            right: 8px;
            height: 12px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    rgba(255, 255, 255, 0.05) 50%,
                    transparent 100%);
            pointer-events: none;
        }

        .pause-btn:hover {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.35) 0%,
                    rgba(255, 255, 255, 0.15) 30%,
                    rgba(0, 0, 0, 0.05) 70%,
                    rgba(0, 0, 0, 0.15) 100%);
        }

        .pause-btn:hover::before {
            border-top-color: rgba(255, 255, 255, 0.55);
            border-left-color: rgba(255, 255, 255, 0.4);
        }

        .pause-btn:active {
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.1) 0%,
                    rgba(0, 0, 0, 0.05) 30%,
                    rgba(255, 255, 255, 0.05) 70%,
                    rgba(255, 255, 255, 0.1) 100%);
        }

        .pause-btn:active::before {
            border-top-color: rgba(0, 0, 0, 0.2);
            border-left-color: rgba(0, 0, 0, 0.15);
            border-bottom-color: rgba(255, 255, 255, 0.2);
            border-right-color: rgba(255, 255, 255, 0.15);
        }

        /* ========== SETTINGS PANEL (in pause menu) ========== */
        .settings-panel {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    rgba(255, 255, 255, 0.05) 20%,
                    rgba(0, 0, 0, 0.1) 80%,
                    rgba(0, 0, 0, 0.2) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 24px 32px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            width: 300px;
            /* Pixelated corners */
            clip-path: polygon(6px 0%, calc(100% - 6px) 0%,
                    100% 6px, 100% calc(100% - 6px),
                    calc(100% - 6px) 100%, 6px 100%,
                    0% calc(100% - 6px), 0% 6px);
            /* Hidden by default with blur transition */
            filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: filter 0.1s ease-in-out, opacity 0.1s ease-in-out;
        }

        /* Show settings panel when in settings mode */
        .pause-menu.settings-mode .settings-panel {
            filter: blur(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Buttons container with blur transition */
        .pause-menu .pause-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            filter: blur(0);
            opacity: 1;
            transition: filter 0.1s ease-in-out, opacity 0.1s ease-in-out;
        }

        /* Hide buttons with blur when in settings mode */
        .pause-menu.settings-mode .pause-buttons {
            filter: blur(4px);
            opacity: 0;
            pointer-events: none;
        }

        /* Also hide title with blur when in settings mode */
        .pause-menu.settings-mode .pause-title {
            filter: blur(4px);
            opacity: 0;
        }

        .settings-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: rgba(255, 255, 255, 0.4);
            border-bottom-color: rgba(0, 0, 0, 0.3);
            clip-path: polygon(6px 0%, calc(100% - 6px) 0%,
                    100% 6px, 100% calc(100% - 6px),
                    calc(100% - 6px) 100%, 6px 100%,
                    0% calc(100% - 6px), 0% 6px);
            pointer-events: none;
        }

        .settings-panel::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 10px;
            right: 10px;
            height: 16px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.04) 50%,
                    transparent 100%);
            pointer-events: none;
        }

        .settings-title {
            font-family: 'Raylib', monospace;
            font-size: 18px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }

        .settings-label {
            font-family: 'Raylib', monospace;
            font-size: 14px;
            color: #e0e0e0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .settings-toggle {
            width: 51px;
            height: 30px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .settings-toggle img {
            width: 51px;
            height: 30px;
            display: block;
            image-rendering: pixelated;
        }

        .settings-close-btn {
            display: block;
            margin: 20px auto 0 auto;
            width: 160px;
        }

        /* Slider row - label on top, slider below */
        .settings-slider-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 8px;
        }

        .settings-slider-container {
            position: relative;
            width: 306px;
            height: 30px;
            image-rendering: pixelated;
        }

        .settings-slider-bar {
            position: absolute;
            top: 9px;
            left: 0;
            width: 306px;
            height: 18px;
            image-rendering: pixelated;
        }

        .settings-slider-knob {
            position: absolute;
            top: 0px;
            left: -6px;
            width: 27px;
            height: 30px;
            image-rendering: pixelated;
        }

        .settings-slider-value {
            font-family: 'Raylib', monospace;
            font-size: 12px;
            color: #fff;
            margin-left: 8px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        /* Speedrun Timer - positioned outside the game canvas */
        #speedrunTimer {
            display: none;
            position: fixed;
            top: 8px;
            right: 12px;
            z-index: 999;
            font-family: 'Raylib', monospace;
            text-align: right;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #speedrunTimer .sr-current {
            font-size: 18px;
            color: #ffffff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.7);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        #speedrunTimer .sr-ms {
            font-size: 11px;
            vertical-align: baseline;
            letter-spacing: 0;
            opacity: 0.7;
            display: inline-block;
            width: 4ch;
            text-align: left;
        }

        #speedrunTimer .sr-best {
            font-size: 12px;
            color: #7eaaff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        #speedrunTimer .sr-best .sr-ms {
            font-size: 9px;
        }

        #speedrunTimer.sr-finished .sr-current {
            color: #6bff6b;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <!-- Speedrun Timer (outside canvas, upper right) -->
    <div id="speedrunTimer">
        <div class="sr-current" id="srCurrentTime">0:00<span class="sr-ms">.000</span></div>
        <div class="sr-best" id="srBestTime"></div>
    </div>

    <!-- Mobile controls (only shown on mobile devices) -->
    <button class="mobile-ctrl-btn mobile-pause-btn" id="mobilePauseBtn">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABmZVhJZklJKgAIAAAAAQBphwQAAQAAABoAAAAAAAAAAwAAkAcABAAAADAyMzABoAMAAQAAAAEAAAAFoAQAAQAAAEQAAAAAAAAAAgABAAIABAAAAFI5OAACAAcABAAAADAxMDAAAAAAIvvHMbnUA7gAAAAsSURBVChTzcqxDQAgDMCw/v80LEyO2OstUmZ2O8+vw8EOBzsc7HCww8Fe6gLab1+hGEAwYgAAAABJRU5ErkJggg=="
            alt="Pause">
    </button>
    <button class="mobile-ctrl-btn mobile-move-left" id="mobileLeft">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABmZVhJZklJKgAIAAAAAQBphwQAAQAAABoAAAAAAAAAAwAAkAcABAAAADAyMzABoAMAAQAAAAEAAAAFoAQAAQAAAEQAAAAAAAAAAgABAAIABAAAAFI5OAACAAcABAAAADAxMDAAAAAAIvvHMbnUA7gAAAArSURBVChTY2AYEPAfCtDFsQKYYqI0kK0YG0BXT7oGECCoABugSBO6OH0AADcpf4GplVu/AAAAAElFTkSuQmCC"
            alt="Left">
    </button>
    <button class="mobile-ctrl-btn mobile-move-right" id="mobileRight">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABmZVhJZklJKgAIAAAAAQBphwQAAQAAABoAAAAAAAAAAwAAkAcABAAAADAyMzABoAMAAQAAAAEAAAAFoAQAAQAAAEQAAAAAAAAAAgABAAIABAAAAFI5OAACAAcABAAAADAxMDAAAAAAIvvHMbnUA7gAAAA7SURBVChTY2AgF/z//x8vJqQYBrBrQpdA0oCiCZ8GrJrQNRAClGtAxyiKCWnAUEysBhRxFIAuiY7JBgBYDj7QMhNwywAAAABJRU5ErkJggg=="
            alt="Right">
    </button>
    <button class="mobile-ctrl-btn mobile-jump-btn" id="mobileJump">

                            const b = data[idx + 2];
                            const a = data[idx + 3];

        // Generate pump textures (pump/bellows look)
        function genPumpTex() {
            const bodyColor = 0x6080a0;
            const highlightColor = 0x80a0c0;
            const shadowColor = 0x405060;
            const nozzleColor = 0x808080;

            for (let rot = 0; rot < 4; rot++) {
                for (let y = 0; y < 12; y++) {
                    texPump[rot][y] = [];
                    for (let x = 0; x < 12; x++) {
                        if (pumpMasks[rot][y][x]) {
                            let col;
                            const cx = 5.5, cy = 5.5;
                            const dx = x - cx, dy = y - cy;
                            if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
                                col = nozzleColor;
                            } else if (dx + dy < 0) {
                                col = highlightColor;
                            } else if (dx + dy > 2) {
                                col = shadowColor;
                            } else {
                                col = bodyColor;
                            }
                            texPump[rot][y][x] = col;
                        } else {
                            texPump[rot][y][x] = -1;
                        }
                    }
                }
            }
        }

        // Generate valve textures (different color scheme)
        function genValveTex() {
            const bodyColor = 0xa06060;
            const highlightColor = 0xc08080;
            const shadowColor = 0x604040;
            const centerColor = 0x805050;

            for (let rot = 0; rot < 4; rot++) {
                for (let y = 0; y < 12; y++) {
                    texValve[rot][y] = [];
                    for (let x = 0; x < 12; x++) {
                        let col;
                        if (x === 0 || y === 0) col = highlightColor;
                        else if (x === 11 || y === 11) col = shadowColor;
                        else {
                            const cx = 5.5, cy = 5.5;
                            const dist = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
                            if (dist < 3) col = centerColor;
                            else col = bodyColor;
                        }
                        texValve[rot][y][x] = col;
                    }
                }
            }
        }

        // Initialize spider trajectory data using Bresenham-style stepping
        function initSpiders() {
            console.log('initSpiders called, spiders count: ' + spiders.length);
            for (const spider of spiders) {
                // Calculate total pixel distance for each axis
                spider.maxX = (spider.endCol - spider.startCol) * 12;
                spider.maxY = (spider.endRow - spider.startRow) * 12;

                const absX = Math.abs(spider.maxX);
                const absY = Math.abs(spider.maxY);

                // Longer axis moves 1 pixel per frame
                if (absX >= absY) {
                    spider.stepX = spider.maxX !== 0 ? Math.sign(spider.maxX) : 0;
                    spider.stepY = 0;  // Y uses accumulator
                    spider.primaryAxis = 'X';
                    spider.primaryMax = absX;
                    spider.secondaryMax = absY;
                } else {
                    spider.stepX = 0;  // X uses accumulator
                    spider.stepY = spider.maxY !== 0 ? Math.sign(spider.maxY) : 0;
                    spider.primaryAxis = 'Y';
                    spider.primaryMax = absY;
                    spider.secondaryMax = absX;
                }

                // Initialize position and accumulators
                spider.posX = 0;
                spider.posY = 0;
                spider.accX = 0;
                spider.accY = 0;
                spider.direction = 1;
                spider.progress = 0;  // Steps taken along primary axis
                spider.frameCounter = 0;
            }
        }

        // Decode tiles — auto-detects RLE (header 'RL') vs legacy raw base64
        function rleDecodeTiles(encoded, expectedSize) {
            const raw = atob(encoded);
            const tiles = new Uint8Array(expectedSize);
            if (raw.length >= 2 && raw.charCodeAt(0) === 82 && raw.charCodeAt(1) === 76) {
                let pos = 2, idx = 0;
                while (pos + 1 < raw.length && idx < expectedSize) {
                    const val = raw.charCodeAt(pos);
                    const count = raw.charCodeAt(pos + 1);
                    const end = Math.min(idx + count, expectedSize);
                    tiles.fill(val, idx, end);
                    idx = end;
                    pos += 2;
                }
            } else {
                const len = Math.min(raw.length, expectedSize);
                for (let i = 0; i < len; i++) {
                    tiles[i] = raw.charCodeAt(i);
                }
            }
            return tiles;
        }

        // Update spider positions using Bresenham-style stepping
        function updateSpiders() {
            const SPIDER_SPEED = 2;  // Engine hard limit: spiders move every 3 frames
            for (const spider of spiders) {
                if (spider.primaryMax === 0) continue;  // No movement

                // Speed control: only move every N frames
                spider.frameCounter++;
                if (spider.frameCounter < SPIDER_SPEED) continue;
                spider.frameCounter = 0;

                // Move one step along primary axis
                if (spider.primaryAxis === 'X') {
                    spider.posX += spider.stepX * spider.direction;
                    // Accumulate secondary axis movement
                    spider.accY += spider.secondaryMax;
                    if (spider.accY >= spider.primaryMax) {
                        spider.accY -= spider.primaryMax;
                        spider.posY += Math.sign(spider.maxY) * spider.direction;
                    }
                } else {
                    spider.posY += spider.stepY * spider.direction;
                    // Accumulate secondary axis movement
                    spider.accX += spider.secondaryMax;
                    if (spider.accX >= spider.primaryMax) {
                        spider.accX -= spider.primaryMax;
                        spider.posX += Math.sign(spider.maxX) * spider.direction;
                    }
                }

                spider.progress += spider.direction;

                // Check if reached the end
                if (spider.progress >= spider.primaryMax) {
                    spider.posX = spider.maxX;
                    spider.posY = spider.maxY;
                    spider.direction = -1;
                    spider.accX = 0;
                    spider.accY = 0;
                } else if (spider.progress <= 0) {
                    spider.posX = 0;
                    spider.posY = 0;
                    spider.direction = 1;
                    spider.accX = 0;
                    spider.accY = 0;
                }
            }

        // Safe ejection mechanism - pushes ball out of any overlapping solids
        // without adding velocity. Tries all directions to find the shortest path out.
        function ejectFromSolids() {
            // If ball can already move freely, no ejection needed
            if (canMove(s, r)) return;

            const MAX_EJECT = 24;  // Maximum pixels to eject (2 tiles worth)

            // Try ejecting in all 4 cardinal directions, find the shortest path out
            const directions = [
                { dx: 0, dy: -1, name: 'up' },     // Up first (most common safe direction)
                { dx: 0, dy: 1, name: 'down' },    // Down
                { dx: -1, dy: 0, name: 'left' },   // Left
                { dx: 1, dy: 0, name: 'right' }    // Right
            ];

            let bestDir = null;
            let bestDist = MAX_EJECT + 1;

            for (const dir of directions) {
                // Check each pixel in this direction
                for (let dist = 1; dist <= MAX_EJECT; dist++) {
                    const testX = s + dir.dx * dist;
                    const testY = r + dir.dy * dist;

                    // Check bounds
                    if (testX < p || testX > COLS * 12 - p ||
                        testY < p || testY > ROWS * 12 - p) {
                        break;  // Out of bounds, try next direction
                    }

                    if (canMove(testX, testY)) {
                        // Found a clear spot in this direction
                        if (dist < bestDist) {
                            bestDist = dist;
                            bestDir = dir;
                        }
                        break;  // Found clear spot, don't check further
                    }
                }
            }

            // Also try diagonal directions as fallback
            const diagonals = [
                { dx: -1, dy: -1, name: 'up-left' },
                { dx: 1, dy: -1, name: 'up-right' },
                { dx: -1, dy: 1, name: 'down-left' },
                { dx: 1, dy: 1, name: 'down-right' }
            ];

            for (const dir of diagonals) {
                for (let dist = 1; dist <= MAX_EJECT; dist++) {

            if (z === 2) {

                const deathScreenX = deathX - (camColOffset * 12 - camPixelOffset);
                const deathScreenY = deathY - camRow * 12;
                drawPop(deathScreenX, deathScreenY);
            } else if (z === 0) {
                // Alive - draw ball with camera offset
                const worldBx = s - p, worldBy = r - p;
                const screenBx = worldBx - (camColOffset * 12 - camPixelOffset);
                const screenBy = worldBy - camRow * 12;
                const ballMask = getBallMask();
                const inWater = isInWater();

                // Check for alternative ball texture
                const altBallTex = (a === 16) ? getTexBallInflated() : getTexBallNormal();

                if (altBallTex) {
                    // Use alternative texture - OPTIMIZED
                    for (let dy = 0; dy < a; dy++) {
                        const py = screenBy + dy;
                        if (py < 0 || py >= GAME_H) continue;
                        for (let dx = 0; dx < a; dx++) {
                            if (ballMask[dy][dx] && altBallTex[dy] && altBallTex[dy][dx] !== -1) {
                                const px = screenBx + dx;
                                if (px >= 0 && px < W) {
                                    let col = altBallTex[dy][dx];
                                    if (inWater) {
                                        const rc = Math.max(0, ((col >> 16) & 0xff) - 20);
                                        const gc = Math.min(255, ((col >> 8) & 0xff) + 10);
                                        const bc = Math.min(255, (col & 0xff) + 30);
                                        col = (rc << 16) | (gc << 8) | bc;
                                    }
                                    setPixel(px, py, col);
                                }
                            }
                        }
                    }
                } else {
                    // Use procedural rendering - OPTIMIZED
                    const cx = a / 2 - 2;
                    for (let dy = 0; dy < a; dy++) {
                        const py = screenBy + dy;
                        if (py < 0 || py >= GAME_H) continue;
                        for (let dx = 0; dx < a; dx++) {
                            if (ballMask[dy][dx]) {
                                const px = screenBx + dx;
                                if (px < 0 || px >= W) continue;
                                const dist = Math.sqrt((dx - cx) * (dx - cx) + (dy - cx) * (dy - cx));
                                let col;
                                if (a === 16) {
                                    col = dist < 3 ? 0xff7070 : (dist < 6 ? 0xe05050 : 0xc03030);
                                } else {
                                    col = dist < 2 ? 0xff5050 : (dist < 4 ? 0xe03030 : 0xb02020);
                                }
                                if (inWater) {
                                    const rc = Math.max(0, ((col >> 16) & 0xff) - 20);
                                    const gc = Math.min(255, ((col >> 8) & 0xff) + 10);
                                    const bc = Math.min(255, (col & 0xff) + 30);
                                    col = (rc << 16) | (gc << 8) | bc;
                                }
                                setPixel(px, py, col);
                            }
                        }
                    }
                }
            }

            // Draw ring RIGHT halves (in front of ball) - OPTIMIZED
            for (let row = startRow; row < endRow; row++) {
                for (let col = startCol; col < endCol; col++) {
                    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) continue;

                    const t = getTile(row, col) & ~WATER_FLAG & 255;

                    // Calculate screen position
                    const screenX = (col - camColOffset) * 12 + camPixelOffset;
                    const screenY = (row - camRow) * 12;

                    // Skip if off screen
                    if (screenX + 12 < 0 || screenX >= W || screenY + 12 < 0 || screenY >= GAME_H) continue;

                    // Hollow block - draw FRONT parts (mask=0 pixels) in front of ball
                    if (t === 56) {
                        const curTex = getTexBlock();
                        for (let y = 0; y < 12; y++) {
                            const py = screenY + y;
                            if (py < 0 || py >= GAME_H) continue;
                            for (let x = 0; x < 12; x++) {
                                if (hollowBlockBehindMask[y][x] === 0) {
                                    const px = screenX + x;
                                    if (px >= 0 && px < W) {
                                        setPixel(px, py, curTex[y][x]);
                                    }
                                }
                            }
                        }
                    } else if (t === 13 || t === 145) {
                        const cached = getCache(_K_RING_TR[t >= 145 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    } else if (t === 14 || t === 146) {
                        const cached = getCache(_K_RING_BR[t >= 146 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    } else if (t === 15 || t === 147) {
                        const cached = getCache(_K_RING_LB[t >= 147 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    } else if (t === 16 || t === 148) {
                        const cached = getCache(_K_RING_RB[t >= 148 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    } else if (t === 21 || t === 153) {
                        const cached = getCache(_K_BIGRING_TR[t >= 153 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    } else if (t === 22 || t === 154) {

                    } else if (t === 23 || t === 155) {
                        const cached = getCache(_K_BIGRING_LB[t >= 155 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    } else if (t === 24 || t === 156) {
                        const cached = getCache(_K_BIGRING_RB[t >= 156 ? 1 : 0]);
                        if (cached) drawCachedTile(cached, screenX, screenY);
                    }
                }
            }

            // ========== HUD DRAWING - OPTIMIZED ==========
            const hudLifeIcon = hudTexturesLoaded ? getHudTexLife() : getTexLife();
            const hudRingIcon = hudTexturesLoaded ? getHudTexRing() : getTexLife();

            // Debug: log once if using fallback
            if (!window._hudDebugLogged) {
                console.log('HUD textures check - loaded:', hudTexturesLoaded, 'life rows:', hudTexLife.length, 'ring rows:', hudTexRing.length);
                window._hudDebugLogged = true;
            }

            // Lives icons - draw to frame buffer
            if (!gameOver) {
                const livesY = GAME_H + 2;
                const maxLivesShown = 5;
                const livesToShow = Math.min(lives, maxLivesShown);

                for (let i = 0; i < livesToShow; i++) {
                    const lx = 4 + i * 11;
                    for (let ty = 0; ty < 12; ty++) {
                        for (let tx = 0; tx < 12; tx++) {
                            if (hudLifeIcon[ty] && hudLifeIcon[ty][tx] !== -1) {
                                setPixel(lx + tx, livesY + ty, hudLifeIcon[ty][tx]);
                            }
                        }
                    }
                }
            }

            // Ring icons
            const ringsY = GAME_H + 15;
            const maxRingsShown = 10;
            const remainingRings = totalRings - collectedRings;
            const ringsToShow = Math.min(remainingRings, maxRingsShown);

            if (remainingRings > 0) {
                for (let i = 0; i < ringsToShow; i++) {
                    const rx = 4 + i * 10;
                    for (let ty = 0; ty < 12; ty++) {
                        for (let tx = 0; tx < 12; tx++) {

                                setPixel(rx + tx, ringsY + ty, hudRingIcon[ty][tx]);

            // Powerup indicator lines
            const MAX_POWERUP_FRAMES = 300;
            const LINE_Y = H - 1;

            // Draw powerup bars inline — no array/object allocation needed
            // Collect active timers, sort by duration (longest first), draw bottom-up
            let _pu1t = 0, _pu1c = 0, _pu2t = 0, _pu2c = 0, _pu3t = 0, _pu3c = 0, _puCount = 0;
            if (y > 0) { _pu1t = y; _pu1c = 0x0099ff; _puCount++; }
            if (h > 0) { if (_puCount === 0) { _pu1t = h; _pu1c = 0xffaa00; } else { _pu2t = h; _pu2c = 0xffaa00; } _puCount++; }
            if (g > 0) { if (_puCount === 0) { _pu1t = g; _pu1c = 0x00ffff; } else if (_puCount === 1) { _pu2t = g; _pu2c = 0x00ffff; } else { _pu3t = g; _pu3c = 0x00ffff; } _puCount++; }
            // Simple sort by timer descending (at most 3 elements)
            if (_pu2t > _pu1t) { let tt = _pu1t, tc = _pu1c; _pu1t = _pu2t; _pu1c = _pu2c; _pu2t = tt; _pu2c = tc; }
            if (_pu3t > _pu1t) { let tt = _pu1t, tc = _pu1c; _pu1t = _pu3t; _pu1c = _pu3c; _pu3t = tt; _pu3c = tc; }
            if (_pu3t > _pu2t) { let tt = _pu2t, tc = _pu2c; _pu2t = _pu3t; _pu2c = _pu3c; _pu3t = tt; _pu3c = tc; }
            if (_pu1t > 0) fillRect(0, LINE_Y, Math.ceil((_pu1t / MAX_POWERUP_FRAMES) * W), 1, _pu1c);
            if (_pu2t > 0) fillRect(0, LINE_Y, Math.ceil((_pu2t / MAX_POWERUP_FRAMES) * W), 1, _pu2c);
            if (_pu3t > 0) fillRect(0, LINE_Y, Math.ceil((_pu3t / MAX_POWERUP_FRAMES) * W), 1, _pu3c);

            // ========== FLUSH FRAME BUFFER TO CANVAS ==========
            flushFrameBuffer();

            // Text overlays need to use ctx directly after flush (text is hard to render in ImageData)
            if (!gameOver && lives > 5) {
                const textX = 4 + Math.min(lives, 5) * 11 + 1;
                ctx.fillStyle = '#ffffff';

                ctx.textAlign = 'left';

            // Score display
            let scoreStr;
            if (score > 99999999) {

                scoreStr = score.toString().padStart(8, '0');

            ctx.fillStyle = '#fffffe';
            ctx.font = '10px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(scoreStr, W - 1, GAME_H + 9);
            ctx.textAlign = 'left';

                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Level complete!', W / 2, GAME_H / 2);

            if (gameOver) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Game over!', W / 2, GAME_H / 2);

        // Update slider knob position based on multiplier (1 to maxMultiplier)
        // At 3x scale: bar is 306px, stem is 27px
        // Stem range: -6px (2px*3 tolerance left) to 285px (306 - 27 + 6 = 285, 2px*3 tolerance right)
        // Total range: 291px
        function updateSliderPosition() {
            const max = getMaxCanvasMultiplier();
            const current = getCanvasMultiplier();
            // Normalize to 0-1 (1 = min multiplier, max = max multiplier)
            const normalized = (current - 1) / Math.max(1, max - 1);
            const knobLeft = -6 + (normalized * 291); // -6 to 285
            scaleSliderKnob.style.left = knobLeft + 'px';
            // Show percentage (100% = max, min% = 1x)
            const percent = Math.round((current / max) * 100);

        // Slider drag logic

        let sliderGrabOffset = 0; // Offset from left edge of knob where user grabbed

        function handleSliderDrag(clientX) {
            const rect = scaleSliderContainer.getBoundingClientRect();
            // Calculate where the left edge of the knob should be
            const knobLeft = clientX - rect.left - sliderGrabOffset;
            // Normalize to 0-1 range (knob left goes from -6 to 285)
            let normalized = (knobLeft + 6) / 291;
            normalized = Math.max(0, Math.min(1, normalized));
            // Convert to multiplier (1 to max)
            const max = getMaxCanvasMultiplier();
            const rawMultiplier = 1 + (normalized * (max - 1));
            // Round to nearest integer for pixel-perfect steps
            canvasScaleMultiplier = Math.round(rawMultiplier);
            canvasScaleMultiplier = Math.max(1, Math.min(max, canvasScaleMultiplier));
            localStorage.setItem('canvasScaleMultiplier', canvasScaleMultiplier);
            updateSliderPosition();
            updateCanvasSize();

        // Fixed timestep game loop constants
        const TICK_RATE = 40; // ms per game tick (25 ticks/second)
        const MAX_CATCHUP_TICKS = 5; // Max ticks to process per frame (prevents spiral of death)

        let lastFrameTime = 0;
        let accumulator = 0;
        let gameRunning = false;

        // Single game tick - runs game logic at fixed 40ms intervals
        function gameTick() {
            update();
            updateSpiders();

            // Spider collision kills the ball (using pixel-perfect mask collision)
            if (typeof window.tickCount === 'undefined') window.tickCount = 0;
            window.tickCount++;
            const spiderHit = checkSpiderCollision(s, r);
            if (z === 0 && spiderHit) {
                z = 2;  // Set death state
                q = 7;  // Reset death timer
                deathX = s;
                deathY = r;
                playSoundPop();  // Play pop sound on death
            }

            // ========== ANTI-CHEAT: Periodic deep validation ==========
            if (window.tickCount % 50 === 0) { // Every ~2 seconds
                const deepValid = _ac.deepValidate(s, r, a, p, l, o, t, z, COLS, ROWS, collectedRings, totalRings);
                if (!deepValid && z === 0) {
                    console.error('[AC] Deep validation failed - forcing FULL PAGE RELOAD');
                    resetGame();
                    fullLevelReset();
                }
            }

            animateDoor();
            updateCamera();
        }

        // Main game loop using requestAnimationFrame with fixed timestep
        function gameLoop(currentTime) {
            if (!gameRunning) return;

            if (gamePaused) {
                showLoadingScreen();
                requestAnimationFrame(gameLoop);
                return;
            }

            const deltaTime = currentTime - lastFrameTime;
            lastFrameTime = currentTime;

            if (deltaTime > 500) {
                accumulator = 0;
                draw();
                requestAnimationFrame(gameLoop);
                return;
            }

            const clampedDelta = Math.min(deltaTime, TICK_RATE * MAX_CATCHUP_TICKS);
            accumulator += clampedDelta;

            let ticksProcessed = 0;
            while (accumulator >= TICK_RATE && ticksProcessed < MAX_CATCHUP_TICKS) {
                gameTick();
                accumulator -= TICK_RATE;
                ticksProcessed++;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // ========== SPEEDRUN TIMER SYSTEM ==========
        const _sr = (function () {
            const enabled = localStorage.getItem('speedrunMode') === 'true';
            const timerEl = document.getElementById('speedrunTimer');
            const currentEl = document.getElementById('srCurrentTime');
            const bestEl = document.getElementById('srBestTime');

            let startTime = 0;       // performance.now() when timer started
            let elapsed = 0;         // total elapsed ms (excluding pauses)
            let pauseStart = 0;      // performance.now() when paused
            let totalPaused = 0;     // total ms spent paused
            let running = false;
            let finished = false;
            let levelNum = 0;
            let rafId = 0;

            function formatTime(ms) {
                const totalSeconds = ms / 1000;
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = Math.floor(totalSeconds % 60);
                const millis = Math.floor(ms % 1000);
                return minutes + ':' + String(seconds).padStart(2, '0') +
                    '<span class="sr-ms">.' + String(millis).padStart(3, '0') + '</span>';
            }

            function bestKey(lvl) {
                return 'sr_best_' + lvl;
            }

            function getBest(lvl) {
                const val = localStorage.getItem(bestKey(lvl));
                return val ? parseFloat(val) : null;
            }

            function saveBest(lvl, ms) {
                const prev = getBest(lvl);
                if (prev === null || ms < prev) {
                    localStorage.setItem(bestKey(lvl), ms.toString());
                    return true;
                }
                return false;
            }

            function showBest() {
                const best = getBest(levelNum);
                if (best !== null) {
                    bestEl.innerHTML = formatTime(best);
                } else {
                    bestEl.innerHTML = '';
                }
            }

            let _lastTimerText = '';
            function tick() {
                if (!running || finished) return;
                const now = performance.now();
                elapsed = now - startTime - totalPaused;
                const txt = formatTime(elapsed);
                if (txt !== _lastTimerText) {
                    _lastTimerText = txt;
                    currentEl.innerHTML = txt;
                }
                rafId = requestAnimationFrame(tick);
            }

            return {
                init: function (lvl) {
                    if (!enabled) return;
                    levelNum = lvl;
                    timerEl.style.display = 'block';
                    timerEl.classList.remove('sr-finished');
                    currentEl.innerHTML = '0:00<span class="sr-ms">.000</span>';
                    showBest();
                },
                start: function () {
                    if (!enabled || running) return;
                    running = true;
                    finished = false;
                    totalPaused = 0;
                    startTime = performance.now();
                    elapsed = 0;
                    tick();
                },
                pause: function () {
                    if (!enabled || !running || finished) return;
                    pauseStart = performance.now();
                    cancelAnimationFrame(rafId);
                },
                resume: function () {
                    if (!enabled || !running || finished) return;
                    if (pauseStart > 0) {
                        totalPaused += performance.now() - pauseStart;
                        pauseStart = 0;
                    }
                    tick();
                },
                stop: function () {
                    if (!enabled || !running || finished) return;
                    finished = true;
                    running = false;
                    cancelAnimationFrame(rafId);
                    // Final precise reading
                    elapsed = performance.now() - startTime - totalPaused;
                    currentEl.innerHTML = formatTime(elapsed);
                    // Check for new best
                    const isNewBest = saveBest(levelNum, elapsed);
                    timerEl.classList.add('sr-finished');
                    showBest();
                    if (isNewBest) {
                        bestEl.innerHTML = 'NEW BEST!  ' + formatTime(elapsed);
                        bestEl.style.color = '#6bff6b';
                    } else {
                        bestEl.style.color = '';
                    }
                },
                isEnabled: function () { return enabled; },
                // Stop timer and hide the display (used on game over)
                hide: function () {
                    if (!enabled) return;
                    cancelAnimationFrame(rafId);
                    running = false;
                    finished = true;
                    timerEl.style.display = 'none';
                },
                // Force-reset: stop any running timer, re-init, and start fresh
                reset: function (lvl) {
                    if (!enabled) return;
                    cancelAnimationFrame(rafId);
                    running = false;
                    finished = false;
                    elapsed = 0;
                    totalPaused = 0;
                    pauseStart = 0;
                    levelNum = lvl;
                    timerEl.style.display = 'block';
                    timerEl.classList.remove('sr-finished');
                    currentEl.innerHTML = '0:00<span class="sr-ms">.000</span>';
                    showBest();
                    // Start immediately
                    running = true;
                    startTime = performance.now();
                    tick();
                }
            };
        })();

        // Preload textures before starting game loop
        async function preloadAndStart() {
            // Abort if level access was blocked
            if (window._levelAccessBlocked) return;
            try {
                // Load all textures fresh
                await loadAltTextures();
                console.log('Textures loaded successfully');

                // Load Igor legacy textures (for IgorBounce levels)
                await loadIgorTextures();
                console.log('Igor textures loaded successfully');
            } catch (err) {
                console.error('Preload error:', err);
            }

            // Check if a level should be loaded from URL
            const onlineToLoad = checkOnlineLevel();
            const levelToLoad = checkURLLevel();
            // ESCAPE HATCH: a failed level load (e.g. online fetch/404/offline) must never
            // trap the user on a dead frame — bail to the parent sector (or navigate).
            try {
                if (onlineToLoad) {
                    console.log('Loading online level ' + onlineToLoad + ' from URL parameter');
                    await loadOnlineLevel(onlineToLoad);
                } else if (levelToLoad) {
                    console.log('Loading classic level ' + levelToLoad + ' from URL parameter');
                    loadClassicLevel(levelToLoad);
                    // Note: loadClassicLevel already initializes spiders with offsets
                } else {
                    // Only call initSpiders for test level - classic levels handle this themselves
                    initSpiders();  // Initialize spider trajectory data
                }
            } catch (loadErr) {
                console.error('Level load failed:', loadErr);
                if (_sectorEmbedded) {
                    _postToParent({ type: 'bounceExit', reason: 'error', online: !!onlineToLoad });
                    return;
                } else {
                    window.location.href = '../#levels';
                    return;
                }
            }

            // Initialize anti-cheat system with initial state
            _ac.sync(s, r, l, o, a, p, y, h, g, t, collectedRings, m);
            console.log('[AC] Anti-cheat system initialized');

            // ========== FUNCTION PROTECTION ==========
            // Protect critical functions from being overwritten (e.g., by god_mode.js)
            // Store internal references that cannot be accessed from outside
            const _internalKillBall = killBall;
            const _internalCheckSpiderHit = checkSpiderHit;
            const _internalCheckSpiderCollision = checkSpiderCollision;

            // Freeze critical functions on window object
            Object.defineProperty(window, 'killBall', {
                value: killBall,
                writable: false,
                configurable: false
            });
            Object.defineProperty(window, 'checkSpiderHit', {
                value: checkSpiderHit,
                writable: false,
                configurable: false
            });
            Object.defineProperty(window, 'checkSpiderCollision', {
                value: checkSpiderCollision,
                writable: false,
                configurable: false
            });

            // NOTE: Authorization functions (beginPhysicsAuth, endPhysicsAuth, authorizeO) are NOT
            // protected on window because doing so breaks internal game code. These functions are
            // internal implementation details. The protection comes from the Object.defineProperty
            // on the actual game state variables (s, r, l, o, lives, score, etc.) which require
            // authorization to be set, making console-based velocity/position manipulation blocked
            // even if someone calls the auth functions from console.

            console.log('[AC] Critical functions protected');


            // Initialize pause menu settings toggles
            initPauseSettings();

            // Pre-warm tile cache so first frames don't stall on cache misses
            prewarmTileCache();

            // ---- everything above is LOADING and runs during the parent's transition ----
            // Wait for the screen to be covered before the game actually starts, so no
            // gameplay (or speedrun time) elapses while the player still can't see it.
            await _startGate;

            // Initialize and start speedrun timer
            _sr.init(_currentLevelNum);
            _sr.start();

            gameRunning = true;
            lastFrameTime = performance.now();
            accumulator = 0;
            canvas.classList.remove('show-cursor');
            requestAnimationFrame(gameLoop);

            // Tell the parent page (game sector) we're live so it can reveal us.
            if (_sectorEmbedded) { _postToParent({ type: 'bounceReady' }); }
        }


        // Wait for splash image to load, then show it and start loading textures
        let preloadStarted = false;  // Prevent re-entry from splash image change
        // Boot gating: when embedded as a sector, the engine must NOT start until the
        // parent's transition is done and it posts {type:'bounceStart'}. Standalone starts
        // immediately. We wait for BOTH the splash image and the start signal.
        let _splashLoaded = false;
        let _startSignal = !_sectorEmbedded; // standalone: no wait
        // The gate the RUN step waits on. Loading (textures, level data, tile cache) is
        // NOT gated — it happens while the parent's transition plays, so the transition
        // isn't padded by the whole engine boot. Only the moment the game actually starts
        // running waits for the screen to be covered.
        let _startResolve = null;
        const _startGate = _sectorEmbedded ? new Promise(res => { _startResolve = res; }) : Promise.resolve();
        function _tryBoot() {
            if (window._levelAccessBlocked) return;
            if (_splashLoaded && !preloadStarted) {
                preloadStarted = true;
                preloadAndStart();   // preloads now; awaits _startGate before running
            }
        }
        splashImage.onload = function () {
            if (window._levelAccessBlocked) return;
            _splashLoaded = true;
            // Paint the splash straight away, BEFORE waiting for the start signal, so the
            // parent cross-fades into artwork instead of an empty black frame. The game
            // itself still doesn't begin until bounceStart arrives.
            showLoadingScreen();
            _tryBoot();
        };
        window.addEventListener('message', function (e) {
            if (e.origin !== window.location.origin) return;
            if (e.data && e.data.type === 'bounceStart') {
                _startSignal = true;
                if (_startResolve) { _startResolve(); _startResolve = null; }
                _tryBoot();
            }
        });

        // Check if loading an IgorBounce level and use Igor splash
        const urlParams = new URLSearchParams(window.location.search);
        const levelParam = urlParams.get('level');
        const onlineParam = urlParams.get('online');
        if (onlineParam) {
            // Online levels use the default splash
            splashImage.src = 'bouncesplash.png';
        } else if (levelParam) {
            const levelNum = parseInt(levelParam, 10);
            if (levelNum >= 1 && typeof CLASSIC_LEVELS !== 'undefined') {
                const level = CLASSIC_LEVELS.find(l => l.number === levelNum);
                if (level && level.author === 'IgorBounce') {
                    splashImage.src = 'igorsplash.png';
                } else {
                    splashImage.src = 'bouncesplash.png';
                }
            } else {
                splashImage.src = 'bouncesplash.png';
            }
        } else {
            splashImage.src = 'bouncesplash.png';
        }
    </script>
